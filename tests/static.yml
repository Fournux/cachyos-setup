---
- name: Validate repository invariants without changing the workstation
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/aur_package/defaults/main.yml
    - ../roles/gnome/defaults/main.yml
  vars:
    dns_nextdns_hostname: test-device-abcdef
    valid_aur_package_names:
      - gapless
      - visual-studio-code-bin
      - proton-ge_custom
    invalid_aur_package_names:
      - --help
      - -root
      - UppercasePackage

  tasks:
    - name: Validate Claude Code MCP config for a fresh and signed-in user
      ansible.builtin.assert:
        quiet: true
        that:
          - static_claude_config.mcpServers.serena.type == 'stdio'
          - "'--context=claude-code' in static_claude_config.mcpServers.serena.args"
          - static_claude_config.mcpServers.context7.type == 'http'
          - >-
            (static_claude_config.mcpServers.context7.get('headers', {}) | length > 0)
            == (item.api_key | length > 0)
          - >-
            item.config.items() | rejectattr('0', 'equalto', 'mcpServers') | list
            | difference(static_claude_config.items() | list) | length == 0
          - >-
            item.config.get('mcpServers', {}).get('custom', {})
            == static_claude_config.mcpServers.get('custom', {})
      vars:
        ai_agents_claude_config:
          content: "{{ item.config | to_json | b64encode }}"
        ai_agents_context7_api_key: "{{ item.api_key }}"
        static_claude_config: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/ai_agents/templates/claude/claude.json.j2') | from_json }}
      loop:
        - config: {}
          api_key: ''
        - config:
            oauthAccount:
              accountUuid: test-account
            projects:
              /tmp/example:
                hasTrustDialogAccepted: true
            mcpServers:
              custom:
                type: stdio
                command: example
          api_key: test-context7-key
      loop_control:
        label: "{{ 'signed-in user' if item.config else 'fresh install' }}"

    - name: Parse the rendered Codex system config as TOML
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import json, sys, tomllib; print(json.dumps(tomllib.load(sys.stdin.buffer)))
        stdin: >-
          {{ lookup('ansible.builtin.template',
                    playbook_dir + '/../roles/ai_agents/templates/codex/config.toml.j2') }}
      vars:
        ai_agents_context7_api_key: "{{ item }}"
      loop:
        - ''
        - test-context7-key
      loop_control:
        label: "{{ 'with Context7 key' if item else 'without Context7 key' }}"
      register: static_codex_configs
      changed_when: false

    # ~/.codex/config.toml belongs to Codex; the system layer must not carry
    # the tables that Codex writes there.
    - name: Validate the Codex system config layer
      ansible.builtin.assert:
        quiet: true
        that:
          - static_codex_config.mcp_servers.serena.command == 'serena'
          - "'--context=codex' in static_codex_config.mcp_servers.serena.args"
          - static_codex_config.mcp_servers.context7.url == 'https://mcp.context7.com/mcp'
          - >-
            ('http_headers' in static_codex_config.mcp_servers.context7)
            == (item.item | length > 0)
          - static_codex_config.features.hooks
          - static_codex_config.keys() | intersect(['projects', 'notice', 'marketplaces', 'plugins']) | length == 0
      vars:
        static_codex_config: "{{ item.stdout | from_json }}"
      loop: "{{ static_codex_configs.results }}"
      loop_control:
        label: "{{ 'with Context7 key' if item.item else 'without Context7 key' }}"

    - name: Accept valid AUR package names
      ansible.builtin.assert:
        quiet: true
        that:
          - item is match(aur_package_name_pattern)
      loop: "{{ valid_aur_package_names }}"

    - name: Reject option-like or invalid AUR package names
      ansible.builtin.assert:
        quiet: true
        that:
          - item is not match(aur_package_name_pattern)
      loop: "{{ invalid_aur_package_names }}"

    - name: Render the managed GNOME dconf keyfile
      ansible.builtin.set_fact:
        static_gnome_dconf: >-
          {{
            lookup(
              'ansible.builtin.template',
              playbook_dir + '/../roles/gnome/templates/dconf-settings.ini.j2'
            )
          }}
      changed_when: false

    - name: Render every enabled GNOME extension into dconf
      ansible.builtin.assert:
        quiet: true
        that:
          - "'dash-to-panel@jderose9.github.com' in static_gnome_dconf"
          - >-
            gnome_enabled_extensions
            | difference(static_gnome_dconf | regex_findall("'([^']+@[^']+)'"))
            | length == 0

    - name: Render the systemd-resolved configuration fixture
      ansible.builtin.set_fact:
        static_resolved_config: >-
          {{
            lookup(
              'ansible.builtin.template',
              playbook_dir + '/../roles/dns/templates/nextdns.conf.j2'
            )
          }}
      changed_when: false
      no_log: true

    - name: Validate IPv4 and IPv6 DNS-over-TLS SNI syntax
      ansible.builtin.assert:
        quiet: true
        that:
          - "'DNS=2a07:a8c0::#test-device-abcdef.dns.nextdns.io' in static_resolved_config"
          - "'DNS=2a07:a8c1::#test-device-abcdef.dns.nextdns.io' in static_resolved_config"
          - "'DNS=45.90.28.0#test-device-abcdef.dns.nextdns.io' in static_resolved_config"

    - name: Run the Plymouth mkinitcpio drop-in against a HOOKS fixture
      ansible.builtin.command:
        argv:
          - bash
          - -c
          - set -eu; HOOKS=(base systemd plymouth autodetect sd-plymouth); . "$1"; printf '%s' "${HOOKS[*]}"
          - static-plymouth-test
          - "{{ playbook_dir }}/../roles/boot/files/90-no-plymouth.conf"
      register: static_plymouth_hooks
      changed_when: false

    - name: Remove only the Plymouth hook
      ansible.builtin.assert:
        quiet: true
        that:
          - static_plymouth_hooks.stdout == 'base systemd autodetect sd-plymouth'
