---
name: Ansible validation

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint and syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out a clean clone
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned validation tooling
        run: |
          python -m pip install --disable-pip-version-check \
            ansible-core==2.21.2 \
            ansible-lint==26.6.0 \
            yamllint==1.38.0
          ansible-galaxy collection install --requirements-file requirements.yml

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate Bash syntax
        run: bash -n bootstrap.sh show-elgato-output.sh tests/check-tags.sh

      - name: Run ShellCheck
        run: shellcheck bootstrap.sh show-elgato-output.sh tests/check-tags.sh

      - name: Lint Ansible and YAML
        run: ./bootstrap.sh lint

      - name: Check Ansible syntax without a vault file
        run: |
          test ! -e .vault-password
          ./bootstrap.sh syntax
