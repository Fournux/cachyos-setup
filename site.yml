---
- name: CachyOS workstation setup
  hosts: all
  connection: local
  gather_facts: true
  force_handlers: true

  pre_tasks:
    - name: Validate the target workstation
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Archlinux'
          - ansible_facts.service_mgr == 'systemd'
          - ansible_facts.user_uid | int != 0
        fail_msg: >-
          This playbook must run as a regular user on an Arch Linux system
          using systemd. Use Ansible become for privileged tasks; do not run
          ansible-playbook through sudo.
      tags: always

    - name: Stop when the inventory host is not this machine
      ansible.builtin.assert:
        that:
          - inventory_hostname == ansible_facts.hostname
        fail_msg: >-
          Inventory host '{{ inventory_hostname }}' is not this machine
          ('{{ ansible_facts.hostname }}'). Run ./bootstrap.sh, or pass
          --limit "$(uname -n)" to ansible-playbook. A new machine needs an
          entry in inventory/hosts.yml.
      tags: always

    # The gnome and boot roles depend on choices made in the CachyOS installer.
    - name: Check the installer choices this playbook builds on
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/bin/gnome-shell
        - /etc/default/limine
        - /usr/bin/limine-mkinitcpio
      register: site_installer_markers
      tags: always

    - name: Stop when CachyOS was not installed with GNOME and Limine
      ansible.builtin.assert:
        that:
          - site_installer_markers.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Missing {{ site_installer_markers.results | rejectattr('stat.exists')
          | map(attribute='item') | join(', ') }}. Install CachyOS with the
          GNOME desktop and the Limine bootloader.
      tags: always

  roles:
    - role: packages
      tags: [packages]
    - role: dotnet
      tags: [dotnet]
    - role: godot
      tags: [godot]
    - role: gimp
      tags: [gimp]
    - role: bash
      tags: [bash, shell]
    - role: lact
      tags: [lact, gpu]
    - role: v4l2loopback
      tags: [v4l2loopback, camera]
    - role: podman
      tags: [podman, containers]
    - role: mpv
      tags: [mpv]
    - role: discord
      tags: [discord]
    - role: desktop
      when: "'desktop' in group_names"
      tags: [desktop]
    - role: laptop
      when: "'laptop' in group_names"
      tags: [laptop]
    - role: environment
      tags: [environment]
    - role: dns
      tags: [dns, network]
    - role: mdns
      tags: [mdns, network]
    - role: boot
      tags: [boot]
    - role: gnome
      tags: [gnome]
    - role: autostart
      tags: [autostart]
    - role: gwtoolbox
      tags: [gwtoolbox, gaming]
    - role: dotfiles
      tags: [dotfiles]
    - role: ai_agents
      tags: [ai_agents]
