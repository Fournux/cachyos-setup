---
argument_specs:
  main:
    short_description: Install a declared list of AUR packages with yay
    options:
      aur_package_packages:
        type: list
        elements: str
        default: []
      aur_package_name_pattern:
        type: str
        default: '^[a-z0-9][a-z0-9@._+-]*$'
      aur_package_dependencies:
        type: list
        elements: str
        default:
          - base-devel
          - yay
      aur_package_helper:
        type: str
        default: /usr/bin/yay
      aur_package_pacman_executable:
        type: str
        default: /usr/bin/pacman
      aur_package_privilege_escalation_executable:
        type: str
        default: /usr/bin/pkexec
