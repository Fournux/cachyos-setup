---
- name: Install Podman packages
  become: true
  community.general.pacman:
    name: "{{ podman_packages }}"
    state: present

- name: Enable Podman socket
  ansible.builtin.systemd_service:
    name: podman.socket
    state: started
    enabled: true
    scope: user

- name: Create containers registries config directory
  become: true
  ansible.builtin.file:
    path: /etc/containers/registries.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure explicit unqualified-search registries
  become: true
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/10-unqualified-search.conf
    content: |
      unqualified-search-registries = {{ podman_unqualified_search_registries | to_json }}
    owner: root
    group: root
    mode: '0644'

- name: Create environment.d directory for Podman
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/environment.d"
    state: directory
    mode: '0755'

- name: Write Podman socket environment
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/environment.d/70-podman.conf"
    content: |
      DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock
    mode: '0644'

- name: Manage Testcontainers Podman settings
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.env.HOME }}/.testcontainers.properties"
    create: true
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED PODMAN SETTINGS"
    block: |
      docker.host=unix:///run/user/{{ ansible_facts.user_uid }}/podman/podman.sock
      ryuk.disabled={{ podman_testcontainers_ryuk_disabled | string | lower }}
