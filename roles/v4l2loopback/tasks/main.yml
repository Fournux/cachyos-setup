---
- name: Read the running kernel pkgbase
  ansible.builtin.slurp:
    src: "{{ v4l2loopback_kernel_pkgbase_path }}"
  register: v4l2loopback_kernel_pkgbase

- name: Install kernel headers and v4l2loopback DKMS package
  become: true
  community.general.pacman:
    name: >-
      {{
        [(v4l2loopback_kernel_pkgbase.content | b64decode | trim) ~ '-headers']
        + v4l2loopback_packages
      }}
    state: present

- name: Configure v4l2loopback module options
  become: true
  ansible.builtin.copy:
    dest: "{{ v4l2loopback_options_path }}"
    content: >
      options v4l2loopback
      devices={{ v4l2loopback_devices | int }}
      video_nr={{ v4l2loopback_video_nr | int }}
      card_label={{ v4l2loopback_card_label | string | to_json }}
      exclusive_caps={{ 1 if v4l2loopback_exclusive_caps | bool else 0 }}
    owner: root
    group: root
    mode: '0644'
  notify: Reload v4l2loopback

- name: Enable v4l2loopback at boot
  become: true
  ansible.builtin.copy:
    dest: "{{ v4l2loopback_modules_load_path }}"
    content: "v4l2loopback\n"
    owner: root
    group: root
    mode: '0644'

- name: Load v4l2loopback module
  become: true
  community.general.modprobe:
    name: v4l2loopback
    state: present
