---
# A missing refcnt file means the module is not loaded; MA== is base64 for 0.
- name: Read the v4l2loopback module reference count
  ansible.builtin.slurp:
    src: /sys/module/v4l2loopback/refcnt
  register: v4l2loopback_refcount
  failed_when: false
  listen: Reload v4l2loopback

- name: Unload an idle v4l2loopback module without force
  become: true
  community.general.modprobe:
    name: v4l2loopback
    state: absent
  when: (v4l2loopback_refcount.content | default('MA==') | b64decode | int) == 0
  listen: Reload v4l2loopback

- name: Load v4l2loopback with the new options
  become: true
  community.general.modprobe:
    name: v4l2loopback
    state: present
  listen: Reload v4l2loopback

- name: Report that busy v4l2loopback options require a reboot
  ansible.builtin.debug:
    msg: >-
      v4l2loopback is currently in use and was not unloaded. Its new options
      will apply after a reboot or a manual reload once all consumers stop.
  when: (v4l2loopback_refcount.content | default('MA==') | b64decode | int) > 0
  listen: Reload v4l2loopback
