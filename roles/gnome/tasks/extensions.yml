---
- name: Check installed extensions.gnome.org extensions
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/share/gnome-shell/extensions/{{ item }}/metadata.json"
  loop: "{{ gnome_ego_extensions }}"
  register: gnome_ego_extension_stats

- name: Install missing extensions.gnome.org extensions
  when:
    - not ansible_check_mode
    - gnome_ego_extensions_missing | length > 0
  vars:
    gnome_ego_extensions_missing: >-
      {{
        gnome_ego_extension_stats.results
        | rejectattr('stat.exists')
        | map(attribute='item')
        | list
      }}
  block:
    - name: Read the installed GNOME Shell version
      ansible.builtin.command:
        argv:
          - gnome-shell
          - --version
      environment:
        LC_ALL: C
      register: gnome_shell_version
      changed_when: false

    - name: Create a temporary GNOME extension download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-gnome-extensions-
      register: gnome_extension_tempdir

    # extensions.gnome.org redirects to the release compatible with this shell.
    - name: Download compatible GNOME extension archives
      ansible.builtin.get_url:
        url: >-
          https://extensions.gnome.org/download-extension/{{ item | urlencode
          }}.shell-extension.zip?shell_version={{ gnome_shell_version.stdout | regex_search('[0-9]+') }}
        dest: "{{ gnome_extension_tempdir.path }}/{{ item }}.zip"
        mode: '0600'
        timeout: "{{ gnome_extension_download_timeout }}"
      loop: "{{ gnome_ego_extensions_missing }}"

    - name: Install downloaded GNOME extension archives
      ansible.builtin.command:
        argv:
          - gnome-extensions
          - install
          - --force
          - "{{ gnome_extension_tempdir.path }}/{{ item }}.zip"
      loop: "{{ gnome_ego_extensions_missing }}"
      changed_when: true
  always:
    - name: Remove the temporary GNOME extension download directory
      ansible.builtin.file:
        path: "{{ gnome_extension_tempdir.path }}"
        state: absent
      when: gnome_extension_tempdir.path is defined
