---
- name: Dump current dconf state before applying preferences
  ansible.builtin.command:
    argv:
      - dconf
      - dump
      - /
  register: gnome_dconf_before
  changed_when: false
  check_mode: false
  no_log: true

- name: Report the conservative dconf plan in check mode
  ansible.builtin.debug:
    msg: >-
      Would load the managed GNOME dconf preferences. A bulk dconf load cannot
      be simulated reliably, so check mode reports a possible change without
      writing to dconf.
  when: ansible_check_mode
  changed_when: true

- name: Apply GNOME dconf preferences
  ansible.builtin.command:
    argv:
      - dconf
      - load
      - /
    stdin: "{{ lookup('ansible.builtin.template', 'dconf-settings.ini.j2') }}"
    stdin_add_newline: false
  when: not ansible_check_mode
  changed_when: false

- name: Dump current dconf state after applying preferences
  ansible.builtin.command:
    argv:
      - dconf
      - dump
      - /
  register: gnome_dconf_after
  when: not ansible_check_mode
  changed_when: false
  no_log: true

- name: Report dconf preference status
  ansible.builtin.debug:
    msg: >-
      {{
        'GNOME dconf preferences changed'
        if gnome_dconf_before.stdout != gnome_dconf_after.stdout
        else 'GNOME dconf preferences already match'
      }}
  when: not ansible_check_mode
  changed_when: gnome_dconf_before.stdout != gnome_dconf_after.stdout
