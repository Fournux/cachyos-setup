---
# Extensions packaged for the installed GNOME release.
gnome_extension_packages:
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-dash-to-panel
  - gnome-shell-extensions
gnome_extension_aur_packages:
  - gnome-shell-extension-just-perfection-desktop

# Vitals has no maintained package, so it comes from extensions.gnome.org.
# GNOME Shell then keeps it up to date.
gnome_ego_extensions:
  - Vitals@CoreCoding.com
gnome_extension_download_timeout: 30

# Rendered into org.gnome.shell enabled-extensions.
gnome_enabled_extensions:
  - dash-to-panel@jderose9.github.com
  - Vitals@CoreCoding.com
  - appindicatorsupport@rgcjonas.gmail.com
  - user-theme@gnome-shell-extensions.gcampax.github.com
  - just-perfection-desktop@just-perfection

gnome_disable_suspend: false
