---
- name: Install Ghostty
  become: true
  community.general.pacman:
    name: "{{ dotfiles_ghostty_packages }}"
    state: present
  tags: [ghostty]

- name: Create Ghostty config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/ghostty"
    state: directory
    mode: '0755'
  tags: [ghostty]

- name: Deploy Ghostty config
  ansible.builtin.copy:
    src: ghostty/config.ghostty
    dest: "{{ ansible_facts.env.HOME }}/.config/ghostty/config.ghostty"
    mode: '0644'
  tags: [ghostty]

- name: Report the latest OMP installation in check mode
  ansible.builtin.debug:
    msg: "Would install {{ dotfiles_omp_package }}@latest."
  when: ansible_check_mode
  changed_when: true
  tags: [omp]

- name: Install the latest OMP version with Bun
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_bun_executable }}"
      - install
      - --global
      - "{{ dotfiles_omp_package }}@latest"
  environment:
    BUN_INSTALL: "{{ ansible_facts.env.HOME }}/.bun"
    PATH: "/usr/bin:{{ ansible_facts.env.HOME }}/.bun/bin:{{ ansible_facts.env.PATH }}"
  when: not ansible_check_mode
  changed_when: true
  tags: [omp]

- name: Install OMP agent skills
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_bun_executable }}"
      - x
      - skills
      - add
      - "{{ item.repository }}"
      - --skill
      - "{{ item.name }}"
      - --global
      - --agent
      - codex
      - --yes
    creates: "{{ ansible_facts.env.HOME }}/.agents/skills/{{ item.name }}/SKILL.md"
  loop: "{{ dotfiles_omp_agent_skills }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [omp]

- name: Create OMP agent config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.omp/agent"
    state: directory
    mode: '0700'
  tags: [omp]

- name: Deploy OMP agent config
  ansible.builtin.copy:
    src: omp/agent/config.yml
    dest: "{{ ansible_facts.env.HOME }}/.omp/agent/config.yml"
    mode: '0600'
  tags: [omp]

- name: Deploy OMP append system
  ansible.builtin.copy:
    src: omp/agent/APPEND_SYSTEM.md
    dest: "{{ ansible_facts.env.HOME }}/.omp/agent/APPEND_SYSTEM.md"
    mode: '0644'
  tags: [omp]

- name: Deploy OMP MCP config
  ansible.builtin.copy:
    src: omp/agent/mcp.json
    dest: "{{ ansible_facts.env.HOME }}/.omp/agent/mcp.json"
    mode: '0600'
  tags: [omp]

- name: Deploy OMP LSP config
  ansible.builtin.copy:
    src: omp/agent/lsp.json
    dest: "{{ ansible_facts.env.HOME }}/.omp/agent/lsp.json"
    mode: '0644'
  tags: [omp]
