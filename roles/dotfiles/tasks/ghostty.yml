---
- name: Install Ghostty
  become: true
  community.general.pacman:
    name: "{{ dotfiles_ghostty_packages }}"
    state: present
  tags: [ghostty]

- name: Create Ghostty config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/ghostty"
    state: directory
    mode: '0755'
  tags: [ghostty]

- name: Deploy Ghostty config
  ansible.builtin.copy:
    src: ghostty/config.ghostty
    dest: "{{ ansible_facts.env.HOME }}/.config/ghostty/config.ghostty"
    mode: '0644'
  tags: [ghostty]
