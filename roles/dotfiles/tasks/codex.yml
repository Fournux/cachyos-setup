---
- name: Create Codex install directory
  ansible.builtin.file:
    path: "{{ dotfiles_codex_install_script_path | dirname }}"
    state: directory
    mode: '0755'
  tags: [codex]

- name: Download the official Codex CLI installer
  ansible.builtin.get_url:
    url: "{{ dotfiles_codex_install_script_url }}"
    dest: "{{ dotfiles_codex_install_script_path }}"
    mode: '0755'
    force: false
  tags: [codex]

- name: Install Codex CLI
  ansible.builtin.command:
    argv:
      - /bin/sh
      - "{{ dotfiles_codex_install_script_path }}"
    creates: "{{ dotfiles_codex_executable }}"
  environment:
    CODEX_NON_INTERACTIVE: "1"
  tags: [codex]

- name: Create Codex config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.codex"
    state: directory
    mode: '0700'
  tags: [codex]

- name: Deploy Codex config
  ansible.builtin.template:
    src: codex/config.toml.j2
    dest: "{{ ansible_facts.env.HOME }}/.codex/config.toml"
    mode: '0600'
  no_log: true
  tags: [codex]

- name: Deploy Codex global instructions
  ansible.builtin.copy:
    src: agents/AGENTS.md
    dest: "{{ ansible_facts.env.HOME }}/.codex/AGENTS.md"
    mode: '0600'
  tags: [codex]

- name: Add i-have-adhd marketplace for Codex
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_codex_executable }}"
      - plugin
      - marketplace
      - add
      - ayghri/i-have-adhd
      - --ref
      - main
    creates: "{{ ansible_facts.env.HOME }}/.codex/.tmp/marketplaces/i-have-adhd"
  tags: [codex]

- name: Install i-have-adhd plugin for Codex
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_codex_executable }}"
      - plugin
      - add
      - i-have-adhd@i-have-adhd
    creates: "{{ ansible_facts.env.HOME }}/.codex/plugins/cache/i-have-adhd"
  tags: [codex]
