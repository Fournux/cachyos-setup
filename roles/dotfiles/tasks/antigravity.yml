---
- name: Create Antigravity install directory
  ansible.builtin.file:
    path: "{{ dotfiles_agy_install_script_path | dirname }}"
    state: directory
    mode: '0755'
  tags: [antigravity, gemini]

- name: Download the official Antigravity CLI installer
  ansible.builtin.get_url:
    url: "{{ dotfiles_agy_install_script_url }}"
    dest: "{{ dotfiles_agy_install_script_path }}"
    mode: '0755'
    force: false
  tags: [antigravity, gemini]

- name: Install Antigravity CLI
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ dotfiles_agy_install_script_path }}"
    creates: "{{ dotfiles_agy_executable }}"
  tags: [antigravity, gemini]

- name: Create Antigravity config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.gemini/config"
    state: directory
    mode: '0700'
  tags: [antigravity, gemini, skills]

- name: Link agent skills to Antigravity global skills
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/.agents/skills"
    dest: "{{ ansible_facts.env.HOME }}/.gemini/config/skills"
    state: link
    force: true
  tags: [antigravity, gemini, skills]

- name: Deploy Antigravity MCP config
  ansible.builtin.template:
    src: gemini/config/mcp_config.json.j2
    dest: "{{ ansible_facts.env.HOME }}/.gemini/config/mcp_config.json"
    mode: '0600'
  no_log: true
  tags: [antigravity, gemini]

- name: Deploy Antigravity global instructions
  ansible.builtin.copy:
    src: agents/AGENTS.md
    dest: "{{ ansible_facts.env.HOME }}/.gemini/config/AGENTS.md"
    mode: '0600'
  tags: [antigravity, gemini]

- name: Create Antigravity CLI directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.gemini/antigravity-cli"
    state: directory
    mode: '0700'
  tags: [antigravity, gemini]

- name: Deploy Antigravity CLI settings
  ansible.builtin.copy:
    src: gemini/antigravity-cli/settings.json
    dest: "{{ ansible_facts.env.HOME }}/.gemini/antigravity-cli/settings.json"
    mode: '0600'
  tags: [antigravity, gemini]

- name: Deploy Antigravity CLI statusline script
  ansible.builtin.copy:
    src: gemini/antigravity-cli/statusline.sh
    dest: "{{ ansible_facts.env.HOME }}/.gemini/antigravity-cli/statusline.sh"
    mode: '0755'
  tags: [antigravity, gemini]

- name: Install i-have-adhd plugin for Antigravity
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_agy_executable }}"
      - plugin
      - install
      - https://github.com/ayghri/i-have-adhd
    creates: "{{ ansible_facts.env.HOME }}/.gemini/config/plugins/i-have-adhd/plugin.json"
  tags: [antigravity, gemini, skills]
