symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 1
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
modelRoles:
  smol: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-sol:auto
  default: google-antigravity/gemini-3.7-flash:high
defaultThinkingLevel: auto
compaction:
  methodOrder:
    - shake
    - remote
    - snapcompact
    - handoff
    - soft
skills:
  includeSkills:
    - ponytail-review
    - ponytail-audit
    - grill*
    - caveman
display:
  showTokenUsage: false
tui:
  textSizing: false
hideThinkingBlock: true
