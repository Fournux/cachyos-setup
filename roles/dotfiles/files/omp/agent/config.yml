symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 2
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
modelRoles:
  smol: google-antigravity/gemini-3.8-flash:low
  slow: openai-codex/gpt-6-astra:auto
  default: google-antigravity/gemini-3.8-flash:high
defaultThinkingLevel: auto
task:
  disabledAgents:
    - reviewer
    - security-reviewer
advisor:
  enabled: false
compaction:
  methodOrder:
    - shake
    - remote
    - snapcompact
    - handoff
    - soft
skills:
  includeSkills:
    - ponytail-review
    - ponytail-audit
    - grill*
    - caveman
display:
  showTokenUsage: true
tui:
  textSizing: false
hideThinkingBlock: true
composer:
  shape: band
statusLine:
  separator: powerline-thin
  contextLine: embedded
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
