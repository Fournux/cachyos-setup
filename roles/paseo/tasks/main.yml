---
- name: Enable systemd user lingering
  become: true
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ ansible_facts.user_id }}"
  changed_when: false

- name: Create systemd user service directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
    state: directory
    mode: '0755'

- name: Create Paseo configuration directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.paseo"
    state: directory
    mode: '0700'

- name: Deploy Paseo configuration
  ansible.builtin.copy:
    src: config.json
    dest: "{{ ansible_facts.env.HOME }}/.paseo/config.json"
    mode: '0600'
  notify: Reload and restart paseo

- name: Deploy Paseo user service
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/paseo.service"
    mode: '0644'
    content: |
      [Unit]
      Description=Paseo Coding Agent Orchestrator
      After=network.target

      [Service]
      ExecStart=/usr/bin/paseo daemon start --foreground --listen 0.0.0.0:6767 --no-relay --web-ui --hostnames true
      Restart=always
      RestartSec=5
      Environment=BUN_INSTALL=%h/.bun
      Environment=PATH=%h/.bun/bin:%h/.local/bin:/usr/local/bin:/usr/bin

      [Install]
      WantedBy=default.target
  notify: Reload and restart paseo

- name: Enable and start Paseo service
  ansible.builtin.systemd_service:
    name: paseo
    scope: user
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

- name: Allow Paseo HTTP from approved networks
  become: true
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "{{ item }}"
    port: '6767'
    comment: Paseo daemon from approved network
  loop: "{{ paseo_allowed_networks }}"
  when: paseo_manage_ufw | bool
  tags: [firewall]
