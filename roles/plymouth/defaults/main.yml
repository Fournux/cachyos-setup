---
plymouth_mkinitcpio_dropin_path: /etc/mkinitcpio.conf.d/90-no-plymouth.conf
plymouth_limine_defaults_path: /etc/default/limine
plymouth_initramfs_command: /usr/bin/limine-mkinitcpio
plymouth_limine_cmdline_options:
  - quiet
  - splash

plymouth_packages:
  - plymouth
  - plymouth-git
  - plymouth-kcm
  - cachyos-plymouth-theme
  - cachyos-plymouth-bootanimation
