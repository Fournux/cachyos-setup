---
- name: Install pacman packages
  become: true
  community.general.pacman:
    name: "{{ packages_pacman_packages }}"
    state: present

- name: Install AUR packages
  ansible.builtin.include_role:
    name: aur_package
    apply:
      tags: always
  vars:
    aur_package_packages: "{{ packages_aur_packages }}"

- name: Install Flatpak
  become: true
  community.general.pacman:
    name: "{{ packages_flatpak_packages_required }}"
    state: present
  tags: [flatpak]

- name: Add Flatpak remotes
  become: true
  community.general.flatpak_remote:
    name: "{{ item.name }}"
    flatpakrepo_url: "{{ item.flatpakrepo_url }}"
    method: system
    state: present
  loop: "{{ packages_flatpak_remotes }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [flatpak]

- name: Install Flatpak packages
  become: true
  community.general.flatpak:
    name: "{{ packages_flatpak_packages }}"
    method: system
    remote: "{{ packages_flatpak_default_remote }}"
    state: present
  when: packages_flatpak_packages | length > 0
  tags: [flatpak]

# Remove when https://github.com/bottlesdevs/Bottles/issues/4695 is fixed upstream.
- name: Read Bottles Flatpak overrides
  ansible.builtin.command:
    argv:
      - flatpak
      - override
      - --user
      - --show
      - com.usebottles.bottles
  register: packages_bottles_flatpak_overrides
  changed_when: false
  check_mode: false
  tags: [flatpak]

- name: Allow Bottles to access UMU runtime data
  ansible.builtin.command:
    argv:
      - flatpak
      - override
      - --user
      - "--filesystem={{ ansible_facts.env.HOME }}/.local/share/umu:create"
      - com.usebottles.bottles
  changed_when: true
  when: >-
    ansible_facts.env.HOME + '/.local/share/umu:create'
    not in packages_bottles_flatpak_overrides.stdout
  tags: [flatpak]
