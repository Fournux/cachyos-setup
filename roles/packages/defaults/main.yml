---
packages_pacman_packages:
  - curl
  - git
  - ripgrep
  - fd
  - jq
  - unzip
  - 7zip
  - gnu-free-fonts
  - ttf-inconsolata
  - firefox
  - steam
  - wine-staging
  - mission-center
  - protonplus
  - obs-studio
  - vlc
  - libreoffice-fresh
  - lutris
  - heroic-games-launcher
  - go-task
  - github-cli
  - wl-clipboard
  - npm
  - qbittorrent
  - ttf-roboto-mono
  - gnome-tweaks
  - extension-manager
  - gnome-menus
  - gnome-boxes
  - gstreamer
  - gst-plugins-base
  - gst-plugins-good
  - gst-plugins-bad
  - gst-plugins-ugly
  - gst-libav
  - gst-plugin-va
  - nicotine+

# Preinstalled by CachyOS; Topgrade handles system upgrades instead.
packages_pacman_packages_absent:
  - cachy-update
  - shelly

# CachyOS enables this cachy-update timer globally; the link is not owned by
# the package, so pacman would leave it dangling.
packages_cachy_update_timer_link: /etc/systemd/user/timers.target.wants/arch-update.timer

packages_aur_packages:
  - claude-desktop
  - visual-studio-code-bin
  - gapless
  - papirus-icon-theme-git
  - opera
  - ankama-launcher

# Machine-specific additions, set in group_vars/<group>/main.yml.
packages_extra_pacman_packages: []
packages_extra_aur_packages: []

packages_flatpak_packages_required:
  - flatpak

packages_flatpak_default_remote: flathub

packages_flatpak_remotes:
  - name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

packages_flatpak_packages:
  - com.usebottles.bottles
