---
- name: Require the NextDNS role inputs
  ansible.builtin.assert:
    that:
      - nextdns_profile_id is defined
      - dns_nextdns_device_name is defined
    fail_msg: >-
      Define nextdns_profile_id in group_vars/all and dns_nextdns_device_name
      in the group_vars of this machine's inventory group.

- name: Validate the private NextDNS profile ID without logging it
  ansible.builtin.set_fact:
    dns_nextdns_profile_is_valid: >-
      {{ (nextdns_profile_id | string) is match('^[0-9a-fA-F]{6}$') }}
  changed_when: false
  no_log: true

- name: Require a valid NextDNS profile ID
  ansible.builtin.assert:
    that:
      - dns_nextdns_profile_is_valid
    fail_msg: >-
      nextdns_profile_id must contain exactly six hexadecimal characters.

- name: Validate the NextDNS device name
  ansible.builtin.assert:
    that:
      - (dns_nextdns_device_name | string) is match('^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$')
      - dns_nextdns_device_name | string | length <= 56
    fail_msg: >-
      dns_nextdns_device_name must be a non-empty DNS label without
      leading/trailing hyphens and at most 56 characters long.

- name: Select the machine-specific NextDNS TLS hostname
  ansible.builtin.set_fact:
    dns_nextdns_hostname: >-
      {{ dns_nextdns_device_name }}-{{ nextdns_profile_id }}
  changed_when: false
  no_log: true

- name: Deploy systemd-resolved config with NextDNS
  become: true
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  diff: false
  no_log: true
  notify: Restart systemd-resolved

- name: Ensure systemd-resolved is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: started
    enabled: true

- name: Install Avahi
  become: true
  community.general.pacman:
    name: avahi
    state: present

- name: Ensure Avahi mDNS daemon is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: avahi-daemon
    state: started
    enabled: true

- name: Allow mDNS from approved networks
  become: true
  community.general.ufw:
    rule: allow
    direction: in
    proto: udp
    from_ip: "{{ item }}"
    port: '5353'
    comment: mDNS from approved network
  loop: "{{ dns_allowed_networks }}"
