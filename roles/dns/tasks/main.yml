---
- name: Require the NextDNS role inputs
  ansible.builtin.assert:
    that:
      - nextdns_profile_id is defined
      - nextdns_device_names is defined
      - nextdns_device_names is mapping
      - machine_profile is defined
    fail_msg: >-
      Define nextdns_profile_id, nextdns_device_names and machine_profile before
      running the DNS role.

- name: Validate the private NextDNS profile ID without logging it
  ansible.builtin.set_fact:
    dns_nextdns_profile_is_valid: >-
      {{ (nextdns_profile_id | string) is match('^[0-9a-fA-F]{6}$') }}
  changed_when: false
  no_log: true

- name: Require a valid NextDNS profile ID
  ansible.builtin.assert:
    that:
      - dns_nextdns_profile_is_valid
    fail_msg: >-
      nextdns_profile_id must contain exactly six hexadecimal characters.

- name: Require a device name for this machine profile
  ansible.builtin.assert:
    that:
      - machine_profile in nextdns_device_names
    fail_msg: >-
      No NextDNS device name is defined for machine profile
      '{{ machine_profile }}'.

- name: Validate the machine-specific NextDNS device name
  ansible.builtin.assert:
    that:
      - (nextdns_device_names[machine_profile] | string) is match('^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$')
      - nextdns_device_names[machine_profile] | string | length <= 56
    fail_msg: >-
      nextdns_device_names['{{ machine_profile }}'] must be a non-empty DNS
      label without leading/trailing hyphens and at most 56 characters long.

- name: Select the machine-specific NextDNS TLS hostname
  ansible.builtin.set_fact:
    dns_nextdns_hostname: >-
      {{ nextdns_device_names[machine_profile] }}-{{ nextdns_profile_id }}
  changed_when: false
  no_log: true

- name: Deploy systemd-resolved config with NextDNS
  become: true
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  diff: false
  no_log: true
  notify: Restart systemd-resolved

- name: Ensure systemd-resolved is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: started
    enabled: true
