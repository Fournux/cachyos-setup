---
- name: Enable Wake-on-LAN globally in NetworkManager
  become: true
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/wol.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [connection]
      ethernet.wake-on-lan=magic
  notify: Reload NetworkManager

- name: Install desktop-specific AUR packages
  ansible.builtin.include_role:
    name: aur_package
    apply:
      tags: always
  vars:
    aur_package_packages: "{{ desktop_aur_packages }}"
  tags: [packages]
