---
- name: Install Avahi and ufw
  become: true
  community.general.pacman:
    name: "{{ mdns_packages }}"
    state: present

- name: Ensure Avahi mDNS daemon is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: avahi-daemon
    state: started
    enabled: true

- name: Allow mDNS from approved networks
  become: true
  community.general.ufw:
    rule: allow
    direction: in
    proto: udp
    from_ip: "{{ item }}"
    port: '5353'
    comment: mDNS from approved network
  loop: "{{ mdns_allowed_networks }}"
