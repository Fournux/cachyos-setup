---
- name: Install Discord and tray support
  become: true
  community.general.pacman:
    name:
      - discord
      - libappindicator-gtk3
    state: present

- name: Create Discord config directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/discord"
    state: directory
    mode: '0755'

- name: Check for existing Discord settings
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.config/discord/settings.json"
  register: discord_settings_file

- name: Read existing Discord settings
  ansible.builtin.slurp:
    src: "{{ ansible_facts.env.HOME }}/.config/discord/settings.json"
  register: discord_settings_raw
  when: discord_settings_file.stat.exists

- name: Enable SKIP_HOST_UPDATE in Discord settings
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/discord/settings.json"
    content: >-
      {{
        (discord_settings_raw.content | default('e30=') | b64decode | from_json)
        | combine({'SKIP_HOST_UPDATE': true})
        | to_nice_json(indent=2, sort_keys=false, ensure_ascii=false)
      }}
    mode: '0644'
    backup: true

- name: Create autostart directory for Discord
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/autostart"
    state: directory
    mode: '0755'

# Discord's own "Open on startup" entry (discord.desktop) points to a
# versioned host binary that its self-updater deletes. This entry uses the
# stable launcher under a name Discord never rewrites.
- name: Autostart Discord through its stable launcher
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.config/autostart/discord-autostart.desktop"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Discord
      Exec=/usr/bin/discord
      Icon=discord
      X-GNOME-Autostart-enabled=true
    mode: '0644'
