---
- name: Install supergfxctl
  become: true
  community.general.pacman:
    name: supergfxctl
    state: present
  tags: [packages]

- name: Enable supergfxd service
  become: true
  ansible.builtin.systemd_service:
    name: supergfxd
    state: started
    enabled: true

- name: Ensure user applications directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/applications"
    state: directory
    mode: '0755'
  tags: [laptop, steam, gaming]

- name: Ensure user local bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: '0755'
  tags: [laptop, steam, gaming]

- name: Check if system Steam desktop file exists
  ansible.builtin.stat:
    path: /usr/share/applications/steam.desktop
  register: laptop_system_steam_desktop
  tags: [laptop, steam, gaming]

- name: Slurp system Steam desktop file
  ansible.builtin.slurp:
    src: /usr/share/applications/steam.desktop
  register: laptop_system_steam_desktop_content
  when: laptop_system_steam_desktop.stat.exists
  tags: [laptop, steam, gaming]

- name: Deploy discrete GPU Steam desktop entry
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.local/share/applications/steam.desktop"
    content: >-
      {{
        (laptop_system_steam_desktop_content.content | b64decode)
        | regex_replace('(?m)^Exec=/usr/bin/steam', 'Exec=env DRI_PRIME=1 /usr/bin/steam')
      }}
    mode: '0644'
  notify: 'laptop : Update desktop database'
  when: laptop_system_steam_desktop.stat.exists
  tags: [laptop, steam, gaming]

- name: Deploy discrete GPU Steam CLI wrapper
  ansible.builtin.copy:
    dest: "{{ ansible_facts.env.HOME }}/.local/bin/steam"
    content: |
      #!/bin/sh
      exec env DRI_PRIME=1 /usr/bin/steam "$@"
    mode: '0755'
  when: laptop_system_steam_desktop.stat.exists
  tags: [laptop, steam, gaming]
