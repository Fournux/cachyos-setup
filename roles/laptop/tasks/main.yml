---
- name: Install laptop-specific packages
  become: true
  community.general.pacman:
    name:
      - asusctl
      - supergfxctl
      - rog-control-center
      - solaar
    state: present

- name: Enable supergfxd service
  become: true
  ansible.builtin.systemd_service:
    name: supergfxd
    state: started
    enabled: true
