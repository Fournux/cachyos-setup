# shellcheck shell=bash
# Managed by Ansible. mkinitcpio sources drop-ins after mkinitcpio.conf, so
# this removes the Plymouth hook without editing the packaged HOOKS line.
for _no_plymouth_index in "${!HOOKS[@]}"; do
  if [[ ${HOOKS[_no_plymouth_index]} == plymouth ]]; then
    unset 'HOOKS[_no_plymouth_index]'
  fi
done
unset _no_plymouth_index
