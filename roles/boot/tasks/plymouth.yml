---
# Deploy the drop-in first: removing the packages triggers an initramfs
# rebuild, which must no longer reference the Plymouth hook.
- name: Drop the Plymouth hook from mkinitcpio HOOKS
  become: true
  ansible.builtin.copy:
    src: 90-no-plymouth.conf
    dest: "{{ boot_plymouth_mkinitcpio_dropin_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Regenerate initramfs

- name: Remove Plymouth packages
  become: true
  community.general.pacman:
    name: "{{ boot_plymouth_packages }}"
    state: absent
  notify: Regenerate initramfs

# limine-mkinitcpio rebuilds the kernel entries of /boot/limine.conf from this
# source. Snapshot entries keep the cmdline of their snapshot on purpose.
- name: Remove Plymouth options from the Limine kernel command source
  become: true
  ansible.builtin.replace:
    path: "{{ boot_limine_defaults_path }}"
    regexp: '^([ \t]*KERNEL_CMDLINE(?:\[[^]\n]+\])?[ \t]*\+?=[ \t]*"[^"\n]*?)(?:(?<=")|(?<=[ \t])){{ item | regex_escape }}(?=[ \t"]|$)[ \t]*'
    replace: '\1'
    backup: true
  loop: "{{ boot_plymouth_cmdline_options }}"
  notify: Regenerate initramfs
