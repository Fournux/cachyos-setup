---
boot_initramfs_command: /usr/bin/limine-mkinitcpio
boot_limine_defaults_path: /etc/default/limine
boot_limine_config_path: /boot/limine.conf

boot_plymouth_mkinitcpio_dropin_path: /etc/mkinitcpio.conf.d/90-no-plymouth.conf
boot_plymouth_cmdline_options:
  - quiet
  - splash

boot_plymouth_packages:
  - plymouth
  - plymouth-git
  - plymouth-kcm
  - cachyos-plymouth-theme
  - cachyos-plymouth-bootanimation

boot_limine_theme:
  interface_branding: ""
  wallpaper: ""
  term_palette: "171421;c01c28;26a269;a2734c;12488b;a347ba;2aa1b3;d0cfcc"
  term_palette_bright: "5e5c64;f66151;33d17a;e9ad0c;2a7bde;c061cb;33c7de;ffffff"
  term_background: "1c1c1c"
  term_foreground: "deddda"
  term_background_bright: "5e5c64"
  term_foreground_bright: "ffffff"
